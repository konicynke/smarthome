services:
  db:
    image: postgres:18.4
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "5433:5432"

volumes:
  postgres_data:

networks:
  backend: