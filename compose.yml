x-simulator: &simulator
  image: smarthome-simulator
  build: ./simulator
  init: true
  restart: unless-stopped
  depends_on:
    - backend
  networks:
    - backend

services:
  db:
    image: postgres:18.4
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "127.0.0.1:5433:5432"

  backend:
    image: smarthome-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    networks:
      - backend
      - frontend
    ports:
      - "8000:8000"

  sim-kitchen:
    <<: *simulator
    environment:
      ROOM: kitchen
      DEVICES: temp_humidity,illuminance,motion,gas
      BACKEND_URL: http://backend:8000
      TZ: Europe/Warsaw

  sim-bedroom:
    <<: *simulator
    environment:
      ROOM: bedroom
      DEVICES: temp_humidity,illuminance,motion
      BACKEND_URL: http://backend:8000
      TZ: Europe/Warsaw

volumes:
  postgres_data:

networks:
  backend:
  frontend: